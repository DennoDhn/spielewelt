<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7e8cb"><title>Tier-Memory</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="kids.css"></head>
<body><main class="game"><header><div class="brand">Tier-Memory</div><button id="settings" aria-label="Einstellungen" title="Einstellungen">⚙</button></header><section id="board" class="board" aria-label="Memory-Spielfeld"></section><footer><button id="restart" aria-label="Neues Spiel" title="Neues Spiel">↻</button><div id="progress" aria-live="polite"></div><button id="sound" aria-label="Ton an oder aus" title="Ton an oder aus">♫</button></footer></main>
<dialog id="options"><div class="dialog-head"><h2>Einstellungen</h2><button id="close" aria-label="Schließen">✕</button></div><p>Wie viele Tierpaare?</p><div class="choices"><button data-pairs="2">2</button><button data-pairs="3">3</button><button data-pairs="4">4</button><button data-pairs="6">6</button></div></dialog>
<dialog id="won"><div class="celebrate" aria-hidden="true">★ ★ ★</div><h2>Geschafft!</h2><button id="again" aria-label="Nochmal spielen">↻ Nochmal!</button></dialog><script src="kids.js" defer></script><script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
