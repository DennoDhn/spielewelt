<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Game / 神経衰弱</title>
  <meta name="description" content="Memory card matching game with 4 difficulty levels and 5 themes. 神経衰弱ゲーム。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Confetti canvas (full-screen overlay, pointer-events:none) -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Win overlay -->
  <div id="win-overlay" class="win-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="win-box">
      <h2 id="win-title" data-i18n="win">You Win! 🎉</h2>
      <p id="win-msg"></p>
      <button id="win-play-again" data-i18n="reset">New Game</button>
    </div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1 data-i18n="title">Memory Game</h1>
        <span class="subtitle" data-i18n="subtitle">Card Matching</span>
      </div>
      <div class="header-controls">
        <button id="dark-btn" class="icon-btn" aria-label="Toggle dark mode">Dark Mode</button>
        <button id="lang-btn" class="icon-btn" aria-label="Switch language">日本語</button>
      </div>
    </header>

    <!-- Controls bar -->
    <div class="controls">
      <div class="control-group">
        <label for="diff-select" data-i18n="difficulty">Difficulty</label>
        <select id="diff-select">
          <option value="easy" data-i18n="easy">Easy</option>
          <option value="medium" selected data-i18n="medium">Medium</option>
          <option value="hard" data-i18n="hard">Hard</option>
          <option value="expert" data-i18n="expert">Expert</option>
        </select>
      </div>
      <div class="control-group">
        <label for="theme-select" data-i18n="theme">Theme</label>
        <select id="theme-select">
          <!-- Options injected by main.js -->
        </select>
      </div>
      <button id="reset-btn" class="reset-btn" data-i18n="reset">New Game</button>
    </div>

    <!-- Stats bar -->
    <div class="stats" role="status" aria-live="polite">
      <div class="stat">
        <span class="stat-label" data-i18n="moves">Moves</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="time">Time</span>
        <span class="stat-value" id="time">00:00</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="bestMoves">Best Moves</span>
        <span class="stat-value" id="best-moves">--</span>
      </div>
      <div class="stat">
        <span class="stat-label" data-i18n="bestTime">Best Time</span>
        <span class="stat-value" id="best-time">--</span>
      </div>
    </div>

    <!-- Card grid -->
    <main id="grid" class="grid" role="main" aria-label="Card grid"></main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
