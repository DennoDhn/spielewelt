<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8fdedb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wunderwelt"><link rel="manifest" href="./manifest.webmanifest"><title>Kleine Wunderwelt</title>
<style>
:root{font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#30405b;background:#b7ebf1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{touch-action:manipulation}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:5px solid #324bd6;outline-offset:3px}#app{min-height:100dvh;overflow:hidden;background:linear-gradient(180deg,#9be3f4 0%,#e3fbef 100%)}header{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 18px 8px;gap:12px;max-width:1050px;margin:auto}h1{font-size:clamp(24px,5vw,42px);margin:0;text-align:center;flex:1;color:#3e5277;text-shadow:0 3px #fff9}h2{font-size:clamp(24px,4vw,36px);margin:8px 0 4px}.round{background:#fff9;border:3px solid #fff;border-radius:24px;min-width:62px;min-height:60px;box-shadow:0 6px 0 #5985a433;padding:8px 16px;font-size:26px}.round:active,.tile:active,.object:active{transform:translateY(4px) scale(.97)}main{max-width:1050px;margin:auto;padding:8px 16px 26px;text-align:center}.intro{font-size:clamp(16px,3vw,22px);margin:6px 0 18px}.worlds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2vw,22px);max-width:860px;margin:22px auto}.tile{min-height:clamp(140px,23vw,225px);border:5px solid #fff;border-radius:34px;background:var(--bg);box-shadow:0 9px 0 #588ca04a;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;font-size:clamp(16px,2.8vw,25px);font-weight:800;color:#405371}.tile .picture{font-size:clamp(54px,9vw,100px);filter:drop-shadow(0 6px 0 #0001);transition:transform .2s}.tile:hover .picture{transform:rotate(-5deg) scale(1.06)}.scene{position:relative;border:7px solid #fff;border-radius:36px;min-height:min(70dvh,600px);padding:16px;overflow:hidden;box-shadow:0 12px 0 #628e9a33;background:linear-gradient(#a6e7fc 0 55%,#b3e49b 55%)}.scene:before{content:"☀️";position:absolute;top:15px;right:22px;font-size:55px;opacity:.9}.scene:after{content:"";position:absolute;bottom:-70px;left:-10%;width:120%;height:130px;border-radius:50%;background:#89d78b;pointer-events:none}.scene h2,.scene .hint{position:relative;z-index:2}.hint{font-size:clamp(16px,3vw,22px);margin:4px 0}.objects{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(12px,3vw,32px);margin:clamp(18px,6vh,50px) auto 20px;max-width:900px}.object{border:4px solid #fff;background:#ffffffb8;border-radius:32px;min-width:clamp(92px,17vw,150px);min-height:clamp(110px,20vw,170px);padding:12px;box-shadow:0 9px 0 #466d8630;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:800;color:#435374}.object .picture{font-size:clamp(55px,9vw,94px);line-height:1.2}.object small{font-size:clamp(13px,2.5vw,18px)}.object.pop .picture{animation:pop .38s ease}.message{position:relative;z-index:4;min-height:58px;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,3.5vw,30px);font-weight:800;color:#4a527a;text-shadow:0 2px #fff}.music{background:linear-gradient(#e8d7ff,#f9e7fb)}.music:after{background:#f3c9f1}.keys{position:relative;z-index:3;display:flex;align-items:flex-start;gap:5px;width:min(100%,820px);margin:clamp(25px,7vh,70px) auto 24px}.key{flex:1;min-width:0;height:clamp(145px,33vw,280px);background:var(--color);border:3px solid #fff;border-radius:12px 12px 23px 23px;box-shadow:0 8px 0 #4a467044;touch-action:none}.key:nth-child(even){height:clamp(125px,29vw,245px)}.key.pressed{filter:brightness(1.15);transform:translateY(6px)}.homeScene{background:linear-gradient(#ffebc9 0 70%,#d9bca0 70%)}.homeScene:before{content:"🪟"}.homeScene:after{background:#b58d6f}.road{background:linear-gradient(#a7e4fc 0 42%,#b5e69c 42% 65%,#747e92 65%)}.road:before{content:"☁️"}.road:after{background:#697386}.garden{background:linear-gradient(#b0eaff 0 52%,#b9eea0 52%)}.garden:before{content:"🌤️"}.garden:after{background:#8cd886}.sparkle{position:fixed;z-index:20;pointer-events:none;font-size:35px;animation:fly .85s ease-out forwards}@keyframes fly{to{transform:translateY(-90px) rotate(25deg);opacity:0}}@keyframes pop{50%{transform:scale(1.22) rotate(-7deg)}}.settings{max-width:600px;margin:20px auto;background:#fff;border-radius:30px;padding:25px;box-shadow:0 8px #0001}.settings label{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:20px 0;font-size:20px}.settings input{width:50%;accent-color:#558ecf}.hidden{display:none!important}.footer{font-size:13px;opacity:.65;margin-top:30px}@media(max-width:620px){.worlds{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:145px}.scene{min-height:65dvh;padding:10px}.objects{gap:10px;margin-top:20px}.object{min-width:90px;min-height:105px;padding:8px}.object .picture{font-size:55px}.round{min-width:54px;padding:5px 10px}header{padding-left:8px;padding-right:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="app"><header><button class="round" id="back" aria-label="Zurück zur Spielauswahl" hidden>🏠</button><h1>🌈 Kleine Wunderwelt</h1><button class="round" id="settingsButton" aria-label="Elternbereich">⚙️</button></header><main id="main"></main></div>
<script>
'use strict';
const main=document.getElementById('main'),back=document.getElementById('back'),settingsButton=document.getElementById('settingsButton');
const worlds=[['farm','🐮','Tierbauernhof','#ffedb8'],['music','🎶','Musikgarten','#ead9ff'],['home','🏡','Mein Zuhause','#ffd9ca'],['road','🚗','Fahrzeugwelt','#cce8ff'],['garden','🌻','Entdeckerwiese','#d6f4bd']];
const scenes={
farm:{title:'Auf dem Bauernhof',hint:'Tippe auf die Tiere!',items:[['🐮','Kuh','Muh!',165],['🐶','Hund','Wau wau!',260],['🐱','Katze','Miau!',430],['🐷','Schwein','Oink!',220],['🐴','Pferd','Hü-hü!',320],['🐥','Küken','Piep piep!',780]]},
home:{title:'Mein kleines Zuhause',hint:'Was passiert, wenn du etwas antippst?',items:[['🧸','Teddy','Kuschelzeit!',330],['💡','Lampe','Licht an!',540],['🍎','Apfel','Mmm, lecker!',440],['🛏️','Bett','Gute Nacht!',250],['🚪','Tür','Klopf, klopf!',180],['🫧','Bad','Blubberblasen!',610]]},
road:{title:'Auf der Straße',hint:'Lass die Fahrzeuge losfahren!',items:[['🚗','Auto','Brumm, brumm!',145],['🚜','Traktor','Tuck, tuck!',115],['🚌','Bus','Tuuut!',200],['🚒','Feuerwehr','Tatü tata!',520],['🚲','Fahrrad','Klingeling!',800],['🚦','Ampel','Grün! Los geht’s!',450]]},
garden:{title:'Auf der Entdeckerwiese',hint:'Hier gibt es viel zu entdecken!',items:[['🌻','Blume','Die Blume wächst!',470],['🦋','Schmetterling','Flatter, flatter!',680],['🫧','Seifenblasen','Plopp!',900],['🐞','Marienkäfer','Hallo, Käfer!',580],['🌈','Regenbogen','So viele Farben!',720],['☁️','Wolke','Pust, pust!',350]]}
};
let current='home',audio=null;let config={volume:.35,sound:true};try{config={...config,...JSON.parse(localStorage.getItem('wunderwelt-settings')||'{}')}}catch{}
function save(){try{localStorage.setItem('wunderwelt-settings',JSON.stringify(config))}catch{}}
function sound(freq,duration=.32,type='sine',delay=0){if(!config.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const start=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,start);osc.frequency.exponentialRampToValueAtTime(freq*.92,start+duration);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(Math.max(.001,config.volume*.35),start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain).connect(audio.destination);osc.start(start);osc.stop(start+duration+.03)}catch(e){console.warn('Audio nicht verfügbar',e)}}
function sparkle(x,y){for(let i=0;i<3;i++){const el=document.createElement('span');el.className='sparkle';el.textContent=['✨','⭐','💛'][i];el.style.left=(x+(i-1)*28)+'px';el.style.top=(y+i*7)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),900)}}
function show(page){current=page;back.hidden=page==='home';settingsButton.hidden=page==='settings';if(page==='home'){main.innerHTML='<p class="intro">Wohin möchtest du heute reisen?</p><div class="worlds">'+worlds.map(([id,emoji,name,bg])=>'<button class="tile" style="--bg:'+bg+'" data-page="'+id+'"><span class="picture">'+emoji+'</span>'+name+'</button>').join('')+'</div><p class="footer">Ohne Werbung · Ohne Zeitdruck · Einfach entdecken</p>';main.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));return}
if(page==='settings'){main.innerHTML='<section class="settings"><h2>Elternbereich</h2><p>Alle Einstellungen bleiben auf diesem Gerät.</p><label>Geräusche <input id="sound" type="checkbox" '+(config.sound?'checked':'')+'></label><label>Lautstärke <input id="volume" type="range" min="0" max="1" step=".05" value="'+config.volume+'"></label><button class="round" id="done">Fertig ✓</button></section>';main.querySelector('#sound').addEventListener('change',e=>{config.sound=e.target.checked;save()});main.querySelector('#volume').addEventListener('input',e=>{config.volume=Number(e.target.value);save()});main.querySelector('#done').addEventListener('click',()=>show('home'));return}
if(page==='music'){main.innerHTML='<section class="scene music"><h2>🎵 Musikgarten</h2><p class="hint">Tippe auf die bunten Klangstäbe!</p><div class="keys" id="keys"></div><div class="message" id="message" aria-live="polite">🎶 Spiel deine Melodie! 🎶</div></section>';const colors=['#ff7878','#ffae63','#ffe37b','#a1e681','#72d7c7','#7bb9f4','#ac9bef','#f0a5db'];const notes=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];notes.forEach((n,i)=>{const b=document.createElement('button');b.className='key';b.style.setProperty('--color',colors[i]);b.setAttribute('aria-label','Klangstab '+(i+1));b.addEventListener('pointerdown',e=>{e.preventDefault();sound(n,.6,'sine');sound(n*2,.2,'triangle');b.classList.add('pressed');sparkle(e.clientX,e.clientY)});['pointerup','pointercancel','pointerleave'].forEach(evt=>b.addEventListener(evt,()=>b.classList.remove('pressed')));main.querySelector('#keys').appendChild(b)});return}
const scene=scenes[page];if(!scene)return show('home');main.innerHTML='<section class="scene '+page+'"><h2>'+scene.title+'</h2><p class="hint">'+scene.hint+'</p><div class="objects">'+scene.items.map((item,i)=>'<button class="object" data-item="'+i+'" aria-label="'+item[1]+'"><span class="picture">'+item[0]+'</span><small>'+item[1]+'</small></button>').join('')+'</div><div class="message" id="message" aria-live="polite">✨ Viel Spaß beim Entdecken! ✨</div></section>';
main.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',e=>{const item=scene.items[Number(b.dataset.item)];main.querySelector('#message').textContent=item[2];b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');sound(item[3],.24,'triangle');sound(item[3]*1.25,.25,'sine',.17);const rect=b.getBoundingClientRect();sparkle(rect.left+rect.width/2,rect.top+rect.height/2)}))}
back.addEventListener('click',()=>show('home'));settingsButton.addEventListener('click',()=>show('settings'));show('home');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
