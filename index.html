<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#9de6ef"><title>Kleine Wunderwelt</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#a9e7f3;color:#263849;touch-action:manipulation}main{max-width:1000px;margin:auto;min-height:100dvh;padding:18px;text-align:center}h1{font-size:clamp(2rem,7vw,4rem);margin:12px}p{font-size:1.2rem}button{font:inherit;cursor:pointer;border:0;border-radius:24px;padding:18px;background:white;box-shadow:0 7px 0 #0002;min-width:92px;min-height:84px}button:active{transform:translateY(4px);box-shadow:0 3px 0 #0002}button:focus-visible{outline:4px solid #155cb4}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:30px auto;max-width:660px}.choices button{font-size:clamp(1.2rem,4vw,2rem);background:#fff4cb}.emoji{display:block;font-size:clamp(3rem,9vw,5rem)}.scene{border-radius:32px;background:linear-gradient(#c8f4ff 60%,#b9eaa0 60%);padding:30px 12px;min-height:50vh}.animals{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:35px}.animals button{font-size:4rem;background:#fff9e7}.back{float:left;font-size:1.4rem;min-height:60px}.note{min-height:3em;font-size:1.6rem;font-weight:700}.keys{display:flex;justify-content:center;gap:5px;align-items:flex-start;margin:30px auto;max-width:780px}.keys button{flex:1;min-width:0;height:clamp(140px,32vw,290px);padding:0;border-radius:12px 12px 22px 22px;background:var(--c)}.keys button:nth-child(2n){height:clamp(125px,29vw,250px)}.keys button:active{filter:brightness(1.2)}.hidden{display:none}@media(max-width:480px){main{padding:12px}.choices{gap:12px}.animals{gap:10px}.animals button{font-size:3rem;padding:10px;min-width:78px}}
</style></head><body><main><button id="back" class="back hidden" aria-label="Zurück zur Auswahl">⌂ Zurück</button><h1>🌈 Kleine Wunderwelt</h1><section id="home"><p>Was möchtest du spielen?</p><div class="choices"><button data-go="farm"><span class="emoji">🐮</span>Tierwelt</button><button data-go="music"><span class="emoji">🎵</span>Musikgarten</button></div></section><section id="farm" class="hidden scene"><h2>Hallo, ihr Tiere!</h2><p>Tippe auf ein Tier!</p><div class="animals"><button data-animal="cow" aria-label="Kuh">🐮</button><button data-animal="dog" aria-label="Hund">🐶</button><button data-animal="cat" aria-label="Katze">🐱</button><button data-animal="pig" aria-label="Schwein">🐷</button><button data-animal="horse" aria-label="Pferd">🐴</button><button data-animal="chick" aria-label="Küken">🐥</button></div><p id="reaction" class="note" aria-live="polite"></p></section><section id="music" class="hidden scene"><h2>Mein Xylophon</h2><p>Spiele deine eigene Melodie!</p><div class="keys" id="keys"></div><p class="note">🎶</p></section></main><script>
const pages=['home','farm','music'];const back=document.querySelector('#back');function show(id){pages.forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==id));back.classList.toggle('hidden',id==='home');document.getElementById('reaction').textContent=''}document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));back.addEventListener('click',()=>show('home'));
let audio;function tone(freq,duration=.32,type='sine'){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.22,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.02)}catch(e){console.warn('Audio nicht verfügbar',e)}}
const sounds={cow:['Muh!',160],dog:['Wau wau!',280],cat:['Miau!',420],pig:['Oink oink!',230],horse:['Wieher!',340],chick:['Piep piep!',740]};document.querySelectorAll('[data-animal]').forEach(b=>b.addEventListener('click',()=>{const [word,f]=sounds[b.dataset.animal];document.getElementById('reaction').textContent=word;tone(f,.22,'triangle');setTimeout(()=>tone(f*1.12,.2,'triangle'),150)}));const notes=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],colors=['#ff7373','#ffa64d','#ffe16a','#88df82','#65d6cb','#7aaefc','#ad91ef','#f49dd4'];const keys=document.getElementById('keys');notes.forEach((n,i)=>{const b=document.createElement('button');b.style.setProperty('--c',colors[i]);b.setAttribute('aria-label','Ton '+(i+1));b.addEventListener('pointerdown',e=>{e.preventDefault();tone(n,.5,'sine')});keys.appendChild(b)});
</script></body></html>
