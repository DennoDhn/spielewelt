<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c7e9ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tier-Memory"><meta name="description" content="Ein liebevolles, werbefreies Tier-Memory für Kinder"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>Tier-Memory</title></head><body><main id="app"><header class="toolbar"><div class="brand"><span aria-hidden="true">✿</span> Tier-Memory</div><div class="toolbar-actions"><button id="restart" class="icon-button" aria-label="Neue Runde" title="Neue Runde">↻</button><button id="settings" class="icon-button" aria-label="Einstellungen" aria-expanded="false" title="Einstellungen">⚙</button></div></header><section class="play-area" aria-label="Memory-Spiel"><div id="board" class="board" aria-label="Memory-Karten"></div></section><footer class="footer"><div id="progress" class="progress" aria-live="polite"></div><div id="status" class="sr-only" aria-live="polite"></div></footer><section id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><div class="settings-sheet"><div class="settings-head"><h2 id="settings-title">Für die Großen</h2><button id="close-settings" class="icon-button" aria-label="Einstellungen schließen">✕</button></div><p>Wie viele Tierpaare?</p><div id="levels" class="level-grid"></div><label class="sound-setting"><span>Klänge</span><input id="sound" type="checkbox" checked></label></div></section><section id="celebration" class="celebration" hidden aria-live="polite"><div class="celebrate-inner"><div class="celebrate-art" aria-hidden="true">🌟</div><h2>Super gemacht!</h2><button id="play-again" class="again">Noch mal spielen ↻</button></div></section></main><script src="./app.js" defer></script></body></html>
