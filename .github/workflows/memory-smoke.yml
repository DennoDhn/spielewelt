name: Tier-Memory Browser Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - 'tests/latest-result.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: memory-browser-report
  cancel-in-progress: false
jobs:
  memory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js && node --check sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Play through memory in three viewport sizes
        run: node tests/memory-smoke.cjs
      - name: Publish test result to repository
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,datetime
          path='tests/latest-result.json'
          with open(path,'w') as f:
              json.dump({'result':os.environ['RESULT'],'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['RUN_ID'],'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat()},f,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/latest-result.json
          git commit -m "Record latest browser test result [skip ci]" || true
          git push origin HEAD:main
