name: Kinder-Memory Browsercheck
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/offline-pwa-hardening]
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check kids.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test Chromium, WebKit, offline and blocked storage
        run: node tests/kids-smoke.cjs
