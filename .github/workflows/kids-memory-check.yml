name: Kinder-Memory Browsercheck
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/offline-pwa-hardening]
jobs:
  chromium:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check kids.js && node --check puzzle.js && node --check switch-game.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          python3 --version
      - name: Test Chromium, WebKit, offline and blocked storage
        run: node tests/kids-smoke.cjs
