<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Bilderpuzzle</title><link rel="stylesheet" href="puzzle.css"><script defer src="puzzle.js"></script></head>
<body><header><button id="back" aria-label="Zum Tier-Memory">🃏</button><strong>Bilderpuzzle</strong><button id="settings" aria-label="Motiv und Teile wählen">⚙</button></header>
